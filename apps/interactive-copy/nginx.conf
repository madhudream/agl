server {
    listen 8080;
    listen [::]:8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # behind the Cloud Run proxy: never emit host:8080 in a redirect
    absolute_redirect off;
    port_in_redirect off;

    gzip on;
    gzip_min_length 512;
    gzip_types text/html text/css text/plain application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer-when-downgrade always;

    location /assets/ {
        add_header Cache-Control "public, max-age=86400";   # file names carry ?v=<build>
    }
    location / {
        try_files $uri $uri/index.html $uri/ =404;
        add_header Cache-Control "public, max-age=300";
    }
    error_page 404 /index.html;
}
